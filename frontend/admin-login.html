<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Aloeglow Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1596040033221-a3f510d6ac71?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') center/cover;
            padding: 20px;
            position: relative;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--gradient-hero);
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 0.8s ease forwards;
        }
        
        body.dark-mode .login-card {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .login-logo {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .login-card h2 {
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .login-subtitle {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }
        
        .form-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            z-index: 2;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg-color);
            border: 2px solid transparent;
            border-radius: var(--border-radius-pill);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            transition: all var(--transition-fast);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(31,69,41,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            border-radius: var(--border-radius-pill);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(31,69,41,0.2);
        }
        
        .login-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .login-footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-leaf"></i>
            </div>
            <h2>Admin Portal</h2>
            <p class="login-subtitle">Aloeglow Store Management</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Login <i class="fas fa-arrow-right"></i>
                </button>
                
                <div id="errorMessage" class="error-message"></div>
            </form>
            
            <div class="login-footer">
                <p><a href="index.html">← Return to Store</a></p>
            </div>
        </div>
    </div>

    <script>
        // Check dark mode
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = '';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('admin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    errorMessage.textContent = data.message || 'Invalid credentials. Please try again.';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
                }
            } catch (error) {
                console.error("Login error:", error);
                errorMessage.textContent = 'Server connection failed. Please try again later.';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
            }
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
